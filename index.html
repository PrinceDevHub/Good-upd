<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>H&M Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h2>H&M</h2>
        <ul>
            <li>Men</li>
            <li>Women</li>
            <li>Kids</li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>New Collection</h1>
        <p>Explore trendy outfits</p>
    </section>

    <!-- Products -->
    <section class="products">
        <div class="card">
            <img src="images/shirt.jpg" alt="">
            <h3>Casual Shirt</h3>
            <p>₹999</p>
        </div>

        <div class="card">
            <img src="images/jeans.jpg" alt="">
            <h3>Blue Jeans</h3>
            <p>₹1499</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 H&M Clone</p>
    </footer>

</body>

</html>
